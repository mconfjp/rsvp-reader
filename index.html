<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSVPリーダー</title>
<meta name="description" content="日本語の文章を文節ごとに高速表示して読むRSVP速読リーダー">
<meta name="theme-color" content="#f7f5f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RSVP">
<style>
  :root {
    --bg: #f7f5f0; --surface: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e2dfd8; --accent: #c2410c; --accent-text: #ffffff; --hl: #fde2cc;
    --word-size: 2.75rem;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a; --surface: #1f2024; --text: #ececef; --muted: #9a9aa2;
      --line: #303137; --accent: #fb923c; --accent-text: #1a1206; --hl: #4a2a14;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171a; --surface: #1f2024; --text: #ececef; --muted: #9a9aa2;
    --line: #303137; --accent: #fb923c; --accent-text: #1a1206; --hl: #4a2a14;
    color-scheme: dark;
  }
  :root[data-size="s"] { --word-size: 2rem; }
  :root[data-size="l"] { --word-size: 3.75rem; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app {
    max-width: 640px; margin: 0 auto; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px;
  }
  .view { display: flex; flex-direction: column; gap: 16px; }
  #reader { flex: 1; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; gap: 8px; }
  header h1 { font-size: 1.25rem; margin: 0; flex: 1; }
  .ghost {
    background: none; border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; min-height: 40px;
  }
  a.ghost { text-decoration: none; font-size: .85rem; display: inline-flex; align-items: center; }
  .primary {
    background: var(--accent); color: var(--accent-text); border: 0; border-radius: 12px;
    padding: 14px; font-weight: 700; font-size: 1rem;
  }
  .primary:disabled { opacity: .4; cursor: default; }

  /* ホーム */
  textarea {
    width: 100%; min-height: 30dvh; resize: vertical; padding: 12px;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; font: inherit; font-size: 16px; line-height: 1.7;
  }
  h2 { font-size: .9rem; color: var(--muted); margin: 8px 0 0; font-weight: 600; }
  .history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .history li {
    display: flex; align-items: center; gap: 4px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 4px 4px 4px 12px;
  }
  .history .open {
    flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .history .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history .meta { font-size: .8rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .bar { width: 64px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .icon-btn { background: none; border: 0; padding: 10px; color: var(--muted); font-size: .85rem; }
  .empty { color: var(--muted); font-size: .9rem; }

  /* リーダー */
  .rtitle { flex: 1; min-width: 0; font-size: .9rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .settings {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: .9rem;
  }
  .settings .row { display: flex; align-items: center; gap: 12px; }
  .settings .row > span { width: 5em; color: var(--muted); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 8px 14px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }

  .stage {
    flex: 1; min-height: 40dvh; position: relative; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; cursor: pointer;
  }
  .rsvp { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 0 12px; }
  .tick { width: 2px; height: 18px; background: var(--accent); opacity: .7; border-radius: 1px; }
  .word {
    font-size: var(--word-size); font-weight: 600; line-height: 1.3; white-space: nowrap;
    min-height: 1.3em; letter-spacing: .02em;
  }
  .context {
    position: absolute; inset: 0; padding: 20px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: .6em;
    font-size: 1.05rem; line-height: 1.8;
  }
  .context p { margin: 0; color: var(--muted); }
  .context p.cur { color: var(--text); }
  .context mark { background: var(--hl); color: inherit; border-radius: 4px; padding: 0 2px; }
  .hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
    font-size: .8rem; color: var(--muted); pointer-events: none; }

  .progress { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); }
  .progress input { flex: 1; accent-color: var(--accent); }
  .progress span { width: 3.5em; text-align: right; font-variant-numeric: tabular-nums; }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
  .controls .ghost { min-height: 48px; }
  .play {
    width: 64px; height: 64px; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--accent-text); font-size: 1.4rem;
  }
  .speed { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .speed .ghost { width: 48px; font-size: 1.2rem; }
  .speed output { font-variant-numeric: tabular-nums; min-width: 8em; text-align: center; }
  .speed output b { font-size: 1.3rem; }

  @media (min-width: 900px) {
    .app { max-width: 820px; }
    :root { --word-size: 3.5rem; }
    :root[data-size="s"] { --word-size: 2.5rem; }
    :root[data-size="l"] { --word-size: 4.75rem; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ホーム -->
  <section id="home" class="view">
    <header>
      <h1>RSVPリーダー</h1>
      <a href="howto.html" class="ghost link">記事から読む</a>
    </header>
    <textarea id="input" placeholder="読みたい文章をここに貼り付け"></textarea>
    <button id="startBtn" class="primary" disabled>読む</button>
    <h2>履歴</h2>
    <ul id="history" class="history"></ul>
    <p id="emptyMsg" class="empty">まだ履歴はありません</p>
  </section>

  <!-- リーダー -->
  <section id="reader" class="view" hidden>
    <header>
      <button id="backBtn" class="ghost" aria-label="一覧に戻る">← 一覧</button>
      <div id="rtitle" class="rtitle"></div>
      <button id="settingsBtn" class="ghost" aria-label="表示設定" aria-expanded="false">Aa</button>
    </header>

    <div id="settings" class="settings" hidden>
      <div class="row"><span>文字サイズ</span>
        <div class="seg" data-key="size">
          <button data-v="s">小</button><button data-v="m">中</button><button data-v="l">大</button>
        </div>
      </div>
      <div class="row"><span>テーマ</span>
        <div class="seg" data-key="theme">
          <button data-v="auto">自動</button><button data-v="light">ライト</button><button data-v="dark">ダーク</button>
        </div>
      </div>
    </div>

    <div id="stage" class="stage" role="button" aria-label="タップで再生・一時停止">
      <div id="rsvp" class="rsvp" hidden>
        <div class="tick"></div>
        <div id="word" class="word"></div>
        <div class="tick"></div>
      </div>
      <div id="context" class="context"></div>
      <div id="hint" class="hint">タップで再生</div>
    </div>

    <div class="progress">
      <input id="seek" type="range" min="0" max="0" value="0" aria-label="読む位置">
      <span id="pct">0%</span>
    </div>
    <div class="controls">
      <button id="prevBtn" class="ghost">⏮ 前の文</button>
      <button id="playBtn" class="play" aria-label="再生">▶</button>
      <button id="nextBtn" class="ghost">次の文 ⏭</button>
    </div>
    <div class="speed">
      <button id="slowerBtn" class="ghost" aria-label="遅く">−</button>
      <output id="wpmOut"><b id="wpm">300</b> 文節/分</output>
      <button id="fasterBtn" class="ghost" aria-label="速く">＋</button>
    </div>
  </section>
</div>

<script src="chunker.js"></script>
<script>
'use strict';

// ---------- 定数 ----------
const STORE_KEY = 'rsvp-reader.v1';
const MAX_HISTORY = 30;
const WPM_MIN = 100, WPM_MAX = 1000, WPM_STEP = 25;
const RAMP = [2.0, 1.8, 1.6, 1.4, 1.2]; // 再生開始直後の5文節は表示時間を伸ばす
const CONTEXT_RADIUS = 2; // 停止中に前後何文を表示するか

// ---------- 保存 ----------
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (d && Array.isArray(d.items)) return d;
  } catch (_) {}
  return { items: [], settings: {} };
}
const db = load();
db.settings = Object.assign({ wpm: 300, size: 'm', theme: 'auto' }, db.settings);
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (_) {}
}

// ---------- 見た目設定 ----------
function applySettings() {
  const root = document.documentElement;
  root.dataset.size = db.settings.size;
  if (db.settings.theme === 'auto') delete root.dataset.theme;
  else root.dataset.theme = db.settings.theme;
  const dark = db.settings.theme === 'dark' ||
    (db.settings.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name="theme-color"]').content = dark ? '#16171a' : '#f7f5f0';
  for (const seg of document.querySelectorAll('.seg')) {
    for (const b of seg.children) b.setAttribute('aria-pressed', String(b.dataset.v === db.settings[seg.dataset.key]));
  }
  $('wpm').textContent = db.settings.wpm;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySettings);

// ---------- DOM ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- ホーム ----------
function makeTitle(text) {
  const t = text.replace(/\s+/g, ' ').trim();
  return t.length > 20 ? t.slice(0, 20) + '…' : t;
}

function renderHistory() {
  const items = [...db.items].sort((a, b) => b.openedAt - a.openedAt);
  $('emptyMsg').hidden = items.length > 0;
  $('history').innerHTML = items.map((it) => {
    const pct = Math.round((it.progress || 0) * 100);
    const date = new Date(it.openedAt).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' });
    return `<li data-id="${it.id}">
      <button class="open"><span class="title">${esc(it.title)}</span>
        <span class="meta"><span class="bar"><i style="width:${pct}%"></i></span>${pct}%<span>${date}</span></span>
      </button>
      <button class="icon-btn" data-act="rename" aria-label="名前を変更">名前</button>
      <button class="icon-btn" data-act="delete" aria-label="削除">削除</button>
    </li>`;
  }).join('');
}

$('input').addEventListener('input', () => { $('startBtn').disabled = !$('input').value.trim(); });

function openText(text, title) {
  let item = db.items.find((it) => it.text === text);
  if (!item) {
    item = {
      id: Date.now().toString(36), title: (title && title.trim().slice(0, 60)) || makeTitle(text),
      text, offset: 0, progress: 0, openedAt: Date.now(),
    };
    db.items.push(item);
    if (db.items.length > MAX_HISTORY) {
      db.items.sort((a, b) => b.openedAt - a.openedAt);
      db.items.length = MAX_HISTORY;
    }
  }
  openReader(item);
}

$('startBtn').addEventListener('click', () => {
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  $('startBtn').disabled = true;
  openText(text);
});

// ショートカットやブックマークレットから #title=...&text=... で文章を受け取る。
// # 以降はサーバーに送られないので、本文が外部に残らない。
function importFromHash() {
  if (location.hash.length < 2) return;
  const params = new URLSearchParams(location.hash.slice(1));
  const text = (params.get('text') || '').replace(/\r\n?/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  history.replaceState(null, '', location.pathname + location.search);
  if (!text) return;
  if (!$('reader').hidden) closeReader();
  openText(text, params.get('title'));
}
addEventListener('hashchange', importFromHash);

$('history').addEventListener('click', (e) => {
  const li = e.target.closest('li');
  if (!li) return;
  const item = db.items.find((it) => it.id === li.dataset.id);
  if (!item) return;
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'rename') {
    const name = prompt('タイトル', item.title);
    if (name && name.trim()) { item.title = name.trim(); save(); renderHistory(); }
  } else if (act === 'delete') {
    if (confirm(`「${item.title}」を削除しますか？`)) {
      db.items = db.items.filter((it) => it !== item); save(); renderHistory();
    }
  } else if (e.target.closest('.open')) {
    openReader(item);
  }
});

// ---------- リーダー ----------
const R = {
  item: null, chunks: [], sentences: [], pos: 0,
  playing: false, timer: 0, ramp: 0, lastSave: 0, wakeLock: null,
};

function openReader(item) {
  const { chunks, sentences } = chunkText(item.text);
  Object.assign(R, { item, chunks, sentences, pos: 0 });
  item.openedAt = Date.now();
  // 保存済みの文字オフセットから位置を復元（分割ロジックが変わってもずれにくい）
  if (item.offset >= item.text.length) R.pos = chunks.length - 1;
  else { for (let i = 0; i < chunks.length && chunks[i].start <= item.offset; i++) R.pos = i; }
  save();
  $('rtitle').textContent = item.title;
  $('seek').max = Math.max(0, chunks.length - 1);
  $('home').hidden = true;
  $('reader').hidden = false;
  history.pushState({ reader: true }, '');
  showPaused();
}

function closeReader() {
  pause();
  $('reader').hidden = true;
  $('home').hidden = false;
  $('settings').hidden = true;
  renderHistory();
}

$('backBtn').addEventListener('click', () => history.back());
addEventListener('popstate', () => { if (!$('reader').hidden) closeReader(); });

function persist(force) {
  if (!R.item) return;
  const now = Date.now();
  if (!force && now - R.lastSave < 2000) return;
  R.lastSave = now;
  const n = R.chunks.length;
  const finished = R.pos >= n;
  R.item.offset = finished ? R.item.text.length : (R.chunks[R.pos]?.start ?? 0);
  R.item.progress = n ? (finished ? 1 : R.pos / n) : 0;
  save();
}

function updateProgress() {
  const n = R.chunks.length;
  const p = Math.min(R.pos, n - 1);
  $('seek').value = Math.max(0, p);
  $('pct').textContent = (n ? Math.round((R.pos >= n ? 1 : R.pos / n) * 100) : 0) + '%';
}

function showWord(text) {
  const el = $('word');
  el.textContent = text;
  el.style.fontSize = '';
  // 長い文節は縮小して画面内に収める
  const avail = $('stage').clientWidth - 24;
  if (el.scrollWidth > avail) {
    const size = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = Math.floor(size * avail / el.scrollWidth) + 'px';
  }
}

function showPaused() {
  $('rsvp').hidden = true;
  $('context').hidden = false;
  $('playBtn').textContent = '▶';
  $('playBtn').setAttribute('aria-label', '再生');
  const n = R.chunks.length;
  if (!n) {
    $('context').innerHTML = '<p>表示できる文章がありません</p>';
    $('hint').hidden = true;
    return;
  }
  if (R.pos >= n) {
    $('context').innerHTML = '<p class="cur" style="text-align:center">読了しました</p>';
    $('hint').textContent = 'タップで最初から';
  } else {
    const c = R.chunks[R.pos];
    const text = R.item.text;
    const from = Math.max(0, c.sent - CONTEXT_RADIUS);
    const to = Math.min(R.sentences.length - 1, c.sent + CONTEXT_RADIUS);
    let html = '';
    for (let i = from; i <= to; i++) {
      const s = R.sentences[i];
      if (i === c.sent) {
        const end = R.pos + 1 < n && R.chunks[R.pos + 1].sent === i ? R.chunks[R.pos + 1].start : s.end;
        html += `<p class="cur">${esc(text.slice(s.start, c.start))}<mark>${esc(text.slice(c.start, end).trimEnd())}</mark>${esc(text.slice(end, s.end))}</p>`;
      } else {
        html += `<p>${esc(text.slice(s.start, s.end))}</p>`;
      }
    }
    $('context').innerHTML = html;
    $('hint').textContent = 'タップで再生';
  }
  $('hint').hidden = false;
  updateProgress();
}

function step() {
  const n = R.chunks.length;
  if (R.pos >= n) { finish(); return; }
  showWord(R.chunks[R.pos].text);
  updateProgress();
  persist(false);
  const base = 60000 / db.settings.wpm;
  const mult = R.ramp < RAMP.length ? RAMP[R.ramp++] : 1;
  R.timer = setTimeout(() => { R.pos++; step(); }, base * mult);
}

function play() {
  if (!R.chunks.length) return;
  if (R.pos >= R.chunks.length) R.pos = 0;
  R.playing = true;
  R.ramp = 0;
  $('context').hidden = true;
  $('hint').hidden = true;
  $('rsvp').hidden = false;
  $('playBtn').textContent = '⏸';
  $('playBtn').setAttribute('aria-label', '一時停止');
  requestWakeLock();
  step();
}

function pause() {
  if (!R.playing) return;
  R.playing = false;
  clearTimeout(R.timer);
  releaseWakeLock();
  persist(true);
  showPaused();
}

function finish() {
  clearTimeout(R.timer);
  R.playing = false;
  R.pos = R.chunks.length;
  releaseWakeLock();
  persist(true);
  showPaused();
}

function toggle() { R.playing ? pause() : play(); }

function jump(pos) {
  R.pos = Math.max(0, Math.min(pos, R.chunks.length - 1));
  if (R.playing) { clearTimeout(R.timer); R.ramp = 0; step(); }
  else { persist(true); showPaused(); }
}

function prevSentence() {
  if (!R.chunks.length) return;
  const cur = Math.min(R.pos, R.chunks.length - 1);
  const s = R.sentences[R.chunks[cur].sent];
  // 文の途中なら文頭へ、文頭にいれば前の文の頭へ
  if (cur > s.first || R.pos >= R.chunks.length) jump(s.first);
  else jump(R.sentences[Math.max(0, R.chunks[cur].sent - 1)].first);
}

function nextSentence() {
  if (!R.chunks.length || R.pos >= R.chunks.length) return;
  const si = R.chunks[R.pos].sent;
  if (si + 1 < R.sentences.length) jump(R.sentences[si + 1].first);
  else jump(R.chunks.length - 1);
}

function changeWpm(delta) {
  db.settings.wpm = Math.max(WPM_MIN, Math.min(WPM_MAX, db.settings.wpm + delta));
  $('wpm').textContent = db.settings.wpm;
  save();
}

$('stage').addEventListener('click', toggle);
$('playBtn').addEventListener('click', toggle);
$('prevBtn').addEventListener('click', prevSentence);
$('nextBtn').addEventListener('click', nextSentence);
$('slowerBtn').addEventListener('click', () => changeWpm(-WPM_STEP));
$('fasterBtn').addEventListener('click', () => changeWpm(WPM_STEP));
$('seek').addEventListener('input', (e) => { if (R.playing) pause(); jump(+e.target.value); });

$('settingsBtn').addEventListener('click', () => {
  const open = $('settings').hidden;
  $('settings').hidden = !open;
  $('settingsBtn').setAttribute('aria-expanded', String(open));
});
for (const seg of document.querySelectorAll('.seg')) {
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    db.settings[seg.dataset.key] = b.dataset.v;
    save();
    applySettings();
    if (R.playing) showWord(R.chunks[R.pos]?.text ?? '');
  });
}

// PC用キーボード操作
addEventListener('keydown', (e) => {
  if ($('reader').hidden || e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); toggle(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); prevSentence(); }
  else if (k === 'ArrowRight') { e.preventDefault(); nextSentence(); }
  else if (k === 'ArrowUp') { e.preventDefault(); changeWpm(WPM_STEP); }
  else if (k === 'ArrowDown') { e.preventDefault(); changeWpm(-WPM_STEP); }
  else if (k === 'Escape') { history.back(); }
});

// ---------- 画面スリープ防止 ----------
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !R.wakeLock) {
      R.wakeLock = await navigator.wakeLock.request('screen');
      R.wakeLock.addEventListener('release', () => { R.wakeLock = null; });
    }
  } catch (_) {}
}
function releaseWakeLock() {
  try { R.wakeLock?.release(); } catch (_) {}
  R.wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pause();
});

// ---------- 起動 ----------
applySettings();
renderHistory();
importFromHash();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
